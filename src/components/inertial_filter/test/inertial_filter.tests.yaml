---
description: This is a unit test suite for the Inertial Filter component
tests:
  - name: Test
    description: Feed a constant star tracker attitude and check the estimate converges to it while the covariance shrinks, as in the algorithm's Python reference test, to ensure the Ada to C to C++ integration is sound.
  - name: Test_Rate_Update
    description: Feed a constant body rate about one axis with the attitude that rotation gives, and check the rate estimate converges to it while the attitude tracks the truth.
  - name: Test_Propagation
    description: Ensure a star tracker product whose time tag has not advanced is not fed to the filter, so the estimate holds and the covariance grows under the process noise.
  - name: Test_Reset
    description: Ensure the estimate reset re-seeds the state and covariance while the measurements reset keeps them.
  - name: Test_Reading_Before_Time_Base
    description: Ensure a star tracker reading stamped before the time base restarted by a reset is dropped, and a later one is applied.
  - name: Test_Time_Anomalies
    description: Ensure a reading stamped after the tick waits until the tick reaches it, and a tick before the time base restarts it, without either shutting out the readings that follow.
  - name: Test_Diagnostics_Packet
    description: Ensure the diagnostics packet is sent every commanded number of ticks, that a period of zero turns it off, and that the command is reported.
  - name: Test_Parameter_Update
    description: Ensure a parameter update rebuilds the filter from the new configuration, restarting the estimate from the configured seed.
  - name: Test_Invalid_Parameter
    description: Ensure a staged configuration the algorithm would reject is refused at validation.
  - name: Test_Invalid_Command
    description: Ensure a malformed command is reported rather than acted on.
  - name: Test_Invalid_Data_Dependency
    description: Ensure a data dependency with the wrong identifier is treated as a wiring defect and fails the tick's assertion.
