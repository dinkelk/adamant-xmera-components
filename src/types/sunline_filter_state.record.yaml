---
description: State of the sunline filter after an update, the estimated state, the variance of each state, and when each kind of reading was last applied. Built from the snapshot the sunlineFilter C shim returns, with the N x N covariance reduced to its diagonal.
fields:
  - name: State
    description: "[-] Estimated state, the sun direction in the body frame, the body rate in rad/s, and the intensity bias."
    type: Packed_F64x7.T
  - name: Covariance_Diagonal
    description: "[-] Diagonal of the state covariance, the variance of each state."
    type: Packed_F64x7.T
  - name: Last_Css_Measurement_Time
    description: System time of the last coarse sun sensor reading applied to the filter, zero until one is applied after the filter is built or reset. Tells when the last sun sensor update happened once this product is sampled into a packet.
    type: Sys_Time.T
  - name: Last_Rate_Measurement_Time
    description: System time of the last body rate reading applied to the filter, zero until one is applied after the filter is built or reset. Tells when the last rate update happened once this product is sampled into a packet.
    type: Sys_Time.T
